name: cks-lib

# Ref.: Doc. 4 §7 (E1, historia 5: "pipeline que valida un bundle EKG contra
# CKS y lo publica versionado"), Doc. 5 §2 (packages/cks/validate es la
# librería que "consume también la CI de ekg-macro"), Doc. 5 §3.2
# (versionado semántico de bundles).
#
# NOTA DE ALCANCE (S1): el repositorio `ekg-macro` (Doc. 5 §1, §3) todavía
# no existe — su CI real (ekg-macro/.ci/validar-cks.yml) es la que
# eventualmente valida y publica bundles reales de contenido económico.
# Mientras tanto, este workflow cumple el criterio de aceptación de la
# historia 5 DENTRO de causeway, en dos partes:
#   1) empaqueta packages/cks (schema + validate) como artefacto versionado
#      — lo que ekg-macro consumirá cuando exista;
#   2) demuestra el pipeline completo de validación de un bundle usando el
#      fixture ilustrativo (Doc. 2 §5.2), como prueba de que "un bundle
#      inválido no se publica; uno válido queda accesible por versión".
# Cuando se cree `ekg-macro`, el job validate-bundle-fixture se traslada
# allí y opera sobre bundles reales en vez del fixture.

on:
  push:
    branches: [main]
    paths:
      - "packages/cks/**"
  pull_request:
    branches: [main]
    paths:
      - "packages/cks/**"
  workflow_dispatch: {}

jobs:
  test-cks-lib:
    name: "Tests de packages/cks/validate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: packages/cks/validate
        run: |
          npm install
          npm test

  validate-bundle-fixture:
    name: "Validar bundle de ejemplo contra CKS (demostración historia 5)"
    needs: test-cks-lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: packages/cks/validate
        run: npm install
      - name: Validar el fixture ilustrativo como si fuera un bundle
        working-directory: packages/cks/validate
        run: |
          node -e "
            const { validarLote } = require('./index.js');
            const fixture = require('./fixtures/mecanismo-monetario-ilustrativo.json');
            const resultado = validarLote('relacion', fixture.relaciones);
            const invalidas = resultado.filter(r => !r.valido);
            if (invalidas.length > 0) {
              console.error('Bundle inválido, no se publica:', JSON.stringify(invalidas, null, 2));
              process.exit(1);
            }
            console.log('Bundle válido: ' + fixture.relaciones.length + ' relaciones OK.');
          "

  package-cks-lib:
    name: "Empaquetar packages/cks como artefacto versionado"
    needs: validate-bundle-fixture
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Leer versión de package.json
        id: version
        working-directory: packages/cks/validate
        run: echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"
      - name: Empaquetar schema/ + validate/ como tarball versionado
        run: |
          mkdir -p dist
          tar -czf "dist/cks-lib-v${{ steps.version.outputs.version }}.tar.gz" \
            packages/cks/schema packages/cks/validate \
            --exclude 'packages/cks/validate/node_modules'
      - uses: actions/upload-artifact@v4
        with:
          name: cks-lib-v${{ steps.version.outputs.version }}
          path: dist/cks-lib-v${{ steps.version.outputs.version }}.tar.gz
