name: cks-lib

# Ref.: Doc. 4 §7 (E1, historia 5: "pipeline que valida un bundle EKG contra
# CKS y lo publica versionado"), Doc. 5 §2 (packages/cks/validate es la
# librería que "consume también la CI de ekg-macro"), Doc. 5 §3.2
# (versionado semántico de bundles).
#
# NOTA DE ALCANCE (S1, resuelta 2026-08-03): este workflow tenía un tercer
# job, `validate-bundle-fixture`, que demostraba el criterio de aceptación
# de la historia 5 DENTRO de causeway (usando el fixture ilustrativo de
# Doc. 2 §5.2) mientras `ekg-macro` no existía. Ese repositorio ya existe
# — el job se trasladó a `ekg-macro/.ci/validar-cks.yml` (ver
# `ekg-macro/README.md` y `causeway/bitacora/sprint-02.md`, entrada de
# migración 2026-08-03) y ahora opera sobre el catálogo real de
# agentes/variables, no sobre el fixture. Este archivo conserva únicamente
# lo que sigue siendo responsabilidad de `causeway` (Doc. 5 §2): correr los
# tests de la librería y empaquetarla como artefacto versionado que
# `ekg-macro` consume.

on:
  push:
    branches: [main]
    paths:
      - "packages/cks/**"
  pull_request:
    branches: [main]
    paths:
      - "packages/cks/**"
  workflow_dispatch: {}

jobs:
  test-cks-lib:
    name: "Tests de packages/cks/validate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: packages/cks/validate
        run: |
          npm install
          npm test

  package-cks-lib:
    name: "Empaquetar packages/cks como artefacto versionado"
    needs: test-cks-lib
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Leer versión de package.json
        id: version
        working-directory: packages/cks/validate
        run: echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"
      - name: Empaquetar schema/ + validate/ como tarball versionado
        run: |
          mkdir -p dist
          tar -czf "dist/cks-lib-v${{ steps.version.outputs.version }}.tar.gz" \
            packages/cks/schema packages/cks/validate \
            --exclude 'packages/cks/validate/node_modules'
      - uses: actions/upload-artifact@v4
        with:
          name: cks-lib-v${{ steps.version.outputs.version }}
          path: dist/cks-lib-v${{ steps.version.outputs.version }}.tar.gz
